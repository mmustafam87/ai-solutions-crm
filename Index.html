                            </div>
                            <div class="pt-4 border-t border-slate-800 flex justify-end gap-3">
                                <button type="button" onclick="closeTimesheetModal()" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium">Cancel</button>
                                <button type="submit" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium shadow-lg shadow-indigo-600/30">Submit Timecard</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function openTimesheetModal() {
            if (state.projects.length === 0) {
                showToast('Please create a project with tasks first.', 'error');
                return;
            }
            const modal = document.getElementById('timesheet-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('ts-date').value = new Date().toISOString().split('T')[0];
        }

        function closeTimesheetModal() {
            const modal = document.getElementById('timesheet-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        function populateTaskDropdown() {
            const projId = document.getElementById('ts-project').value;
            const taskSelect = document.getElementById('ts-task');
            taskSelect.innerHTML = '<option value="">-- Choose Task --</option>';
            if (!projId) return;
            const p = state.projects.find(x => x.id === projId);
            if (p && p.tasks) {
                p.tasks.forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = t.title;
                    opt.textContent = `${t.title} (${t.hours} hrs budgeted)`;
                    taskSelect.appendChild(opt);
                });
            }
        }

        function handleSaveTimesheet(e) {
            e.preventDefault();
            const weekEnding = document.getElementById('ts-date').value;
            const projId = document.getElementById('ts-project').value;
            const taskName = document.getElementById('ts-task').value;
            const hours = parseFloat(document.getElementById('ts-hours').value);

            const p = state.projects.find(x => x.id === projId);

            const newEntry = {
                id: 'ts_' + Date.now(),
                employeeEmail: state.currentUser.email,
                employeeName: state.currentUser.name || state.currentUser.email,
                weekEnding,
                projectId: projId,
                projectName: p ? p.name : 'Unknown',
                taskName,
                hours,
                status: 'Pending'
            };

            state.timesheets.push(newEntry);
            saveState();
            closeTimesheetModal();
            showToast('Timesheet submitted for approval.');
            render();
        }

        function updateTimesheetStatus(id, status) {
            const t = state.timesheets.find(x => x.id === id);
            if (t) {
                t.status = status;
                saveState();
                showToast(`Timesheet ${status.toLowerCase()}.`);
                render();
            }
        }

        // --- EMPLOYEES & RATES TAB (ADMIN ONLY) ---
        function renderEmployeesTab() {
            const employees = state.users.filter(u => u.role === 'employee');
            return `
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-xl font-bold text-slate-100">Team & Hourly Rates</h2>
                            <p class="text-xs text-slate-400 mt-1">Add employee accounts and configure login credentials & hourly rates.</p>
                        </div>
                        <button onclick="openEmployeeModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2.5 rounded-xl transition flex items-center gap-2 text-sm shadow-lg shadow-indigo-600/30">
                            <i data-lucide="user-plus" class="w-4 h-4"></i>
                            <span>Add Employee</span>
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        ${employees.length === 0 ? `
                            <div class="col-span-3 bg-slate-900 border border-slate-800 rounded-2xl p-12 text-center text-slate-500">
                                <i data-lucide="users" class="w-12 h-12 mx-auto mb-3 opacity-40"></i>
                                <p class="text-sm">No employees added yet.</p>
                            </div>
                        ` : employees.map(emp => `
                            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col justify-between">
                                <div>
                                    <div class="flex items-center justify-between mb-3">
                                        <div class="w-10 h-10 rounded-xl bg-indigo-950 text-indigo-400 border border-indigo-900/50 flex items-center justify-center font-bold">
                                            ${(emp.name || emp.email).charAt(0).toUpperCase()}
                                        </div>
                                        <button onclick="deleteEmployee('${emp.email}')" class="p-2 hover:bg-slate-800 text-slate-400 hover:text-red-400 rounded-lg transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                    </div>
                                    <h3 class="text-base font-bold text-slate-100">${emp.name || 'Employee'}</h3>
                                    <p class="text-xs text-slate-400 mb-4">${emp.email}</p>
                                </div>
                                <div class="pt-4 border-t border-slate-800 flex items-center justify-between text-xs">
                                    <span class="text-slate-400">Hourly Rate:</span>
                                    <span class="font-bold text-emerald-400 text-sm">$${emp.hourlyRate || 0} / hr</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <!-- Employee Modal -->
                <div id="employee-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
                    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-md shadow-2xl">
                        <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800">
                            <h3 class="text-lg font-bold text-slate-100">Add New Employee</h3>
                            <button onclick="closeEmployeeModal()" class="text-slate-400 hover:text-slate-200"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <form onsubmit="handleSaveEmployee(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Full Name</label>
                                <input type="text" id="emp-name" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500" placeholder="John Doe">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Email Address (Login)</label>
                                <input type="email" id="emp-email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500" placeholder="employee@ai.com">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Password</label>
                                <input type="password" id="emp-pass" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500" placeholder="••••••••">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Hourly Rate ($)</label>
                                <input type="number" id="emp-rate" required min="0" step="0.5" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500" placeholder="50">
                            </div>
                            <div class="pt-4 border-t border-slate-800 flex justify-end gap-3">
                                <button type="button" onclick="closeEmployeeModal()" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium">Cancel</button>
                                <button type="submit" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium shadow-lg shadow-indigo-600/30">Create Account</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function openEmployeeModal() {
            const modal = document.getElementById('employee-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeEmployeeModal() {
            const modal = document.getElementById('employee-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        function handleSaveEmployee(e) {
            e.preventDefault();
            const name = document.getElementById('emp-name').value.trim();
            const email = document.getElementById('emp-email').value.trim().toLowerCase();
            const pass = document.getElementById('emp-pass').value;
            const hourlyRate = parseFloat(document.getElementById('emp-rate').value);

            if (state.users.some(u => u.email.toLowerCase() === email)) {
                showToast('An account with this email already exists.', 'error');
                return;
            }

            state.users.push({ email, pass, role: 'employee', name, hourlyRate });
            saveState();
            closeEmployeeModal();
            showToast('Employee account created successfully.');
            render();
        }

        function deleteEmployee(email) {
            if (confirm('Are you sure you want to remove this employee?')) {
                state.users = state.users.filter(u => u.email !== email);
                saveState();
                showToast('Employee removed.');
                render();
            }
        }

        // --- SETTINGS TAB ---
        function renderSettingsTab() {
            return `
                <div class="max-w-xl space-y-6">
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                        <h3 class="text-base font-bold text-slate-100 mb-4">Change Password</h3>
                        <form onsubmit="handlePasswordChange(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Current Password</label>
                                <input type="password" id="set-curr-pass" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">New Password</label>
                                <input type="password" id="set-new-pass" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                            </div>
                            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-2.5 rounded-xl transition text-sm shadow-lg shadow-indigo-600/30">Update Password</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function handlePasswordChange(e) {
            e.preventDefault();
            const currPass = document.getElementById('set-curr-pass').value;
            const newPass = document.getElementById('set-new-pass').value;

            if (state.currentUser.pass !== currPass) {
                showToast('Current password is incorrect.', 'error');
                return;
            }

            state.currentUser.pass = newPass;
            const userInList = state.users.find(u => u.email === state.currentUser.email);
            if (userInList) userInList.pass = newPass;

            saveState();
            showToast('Password updated successfully.');
            document.getElementById('set-curr-pass').value = '';
            document.getElementById('set-new-pass').value = '';
        }

        // Initial Render
        render();
    </script>
</body>
</html>
