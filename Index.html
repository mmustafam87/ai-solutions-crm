<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Solutions CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
    <!-- App Root Container -->
    <div id="app" class="flex-1 flex flex-col"></div>

    <script>
        // --- EMBEDDED LOGO DATA URI ---
        const LOGO_BASE64 = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAMAAADDpiTIAAAABGdBTUEAALGPC/xhBQAAACBjSFJNAAB6JgAAgIQAAPoAAACA6AAAdTAAAOpgAAA6mAAAF3CculE8AAAB+VBMVEX////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////";

        // --- STATE MANAGEMENT ---
        let state = {
            currentUser: null, // { email, role: 'admin'|'employee', name }
            users: JSON.parse(localStorage.getItem('ai_solutions_users')) || [
                { email: 'mmuharam.a87@gmail.com', pass: 'admin123', role: 'admin', name: 'Mohamed Muharam' }
            ],
            projects: JSON.parse(localStorage.getItem('ai_solutions_projects')) || [],
            timesheets: JSON.parse(localStorage.getItem('ai_solutions_timesheets')) || [],
            activeTab: 'dashboard'
        };

        function saveState() {
            localStorage.setItem('ai_solutions_users', JSON.stringify(state.users));
            localStorage.setItem('ai_solutions_projects', JSON.stringify(state.projects));
            localStorage.setItem('ai_solutions_timesheets', JSON.stringify(state.timesheets));
        }

        // --- TOAST NOTIFICATION ---
        function showToast(message, type = 'success') {
            const existing = document.getElementById('toast-notification');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.id = 'toast-notification';
            toast.className = `fixed bottom-5 right-5 z-50 px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 text-sm font-medium border transition-all transform translate-y-0 ${
                type === 'error' ? 'bg-red-950/90 border-red-800 text-red-200' : 'bg-emerald-950/90 border-emerald-800 text-emerald-200'
            }`;
            toast.innerHTML = `<i data-lucide="${type === 'error' ? 'alert-circle' : 'check-circle-2'}" class="w-5 h-5"></i><span>${message}</span>`;
            document.body.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => { toast.remove(); }, 3500);
        }

        // --- RENDER ROUTER ---
        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (!state.currentUser) {
                app.innerHTML = renderLogin();
            } else {
                app.innerHTML = renderDashboard();
            }
            lucide.createIcons();
        }

        // --- LOGIN VIEW ---
        function renderLogin() {
            return `
                <div class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950">
                    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 w-full max-w-md shadow-2xl shadow-indigo-950/30">
                        <div class="text-center mb-8">
                            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-slate-800/80 border border-slate-700/60 mb-4 overflow-hidden shadow-inner p-2">
                                <img src="${LOGO_BASE64}" alt="AI Solutions Logo" class="w-full h-full object-contain">
                            </div>
                            <h1 class="text-2xl font-bold tracking-tight text-white">AI Solutions CRM</h1>
                            <p class="text-sm text-slate-400 mt-1">Sign in with your email and password</p>
                        </div>
                        <form onsubmit="handleLogin(event)" class="space-y-5">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Email Address</label>
                                <input type="email" id="login-email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-sm" placeholder="e.g. mmuharam.a87@gmail.com">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Password</label>
                                <input type="password" id="login-password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-sm" placeholder="••••••••">
                            </div>
                            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl transition duration-200 shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2 text-sm">
                                <span>Sign In</span>
                                <i data-lucide="arrow-right" class="w-4 h-4"></i>
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim().toLowerCase();
            const pass = document.getElementById('login-password').value;

            const user = state.users.find(u => u.email.toLowerCase() === email && u.pass === pass);
            if (!user) {
                showToast('Invalid email or password. Please try again.', 'error');
                return;
            }

            state.currentUser = user;
            state.activeTab = 'dashboard';
            showToast(`Welcome back, ${user.name || user.email}!`);
            render();
        }

        // --- DASHBOARD LAYOUT ---
        function renderDashboard() {
            const isAdmin = state.currentUser.role === 'admin';
            return `
                <div class="flex h-screen overflow-hidden bg-slate-950">
                    <!-- Sidebar -->
                    <aside class="w-64 bg-slate-900 border-r border-slate-800/80 flex flex-col justify-between">
                        <div>
                            <div class="p-6 border-b border-slate-800/80 flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl bg-slate-800/90 border border-slate-700/60 p-1.5 flex items-center justify-center overflow-hidden">
                                    <img src="${LOGO_BASE64}" alt="Logo" class="w-full h-full object-contain">
                                </div>
                                <div>
                                    <h2 class="font-bold text-sm text-slate-100 leading-tight">AI Solutions</h2>
                                    <span class="text-xs text-indigo-400 font-medium">${isAdmin ? 'Admin Portal' : 'Employee Portal'}</span>
                                </div>
                            </div>
                            <nav class="p-4 space-y-1.5">
                                <button onclick="switchTab('dashboard')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition ${state.activeTab === 'dashboard' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}">
                                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                                    <span>Dashboard</span>
                                </button>
                                <button onclick="switchTab('projects')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition ${state.activeTab === 'projects' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}">
                                    <i data-lucide="folder-kanban" class="w-4 h-4"></i>
                                    <span>Projects & Tasks</span>
                                </button>
                                <button onclick="switchTab('timesheets')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition ${state.activeTab === 'timesheets' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}">
                                    <i data-lucide="clock" class="w-4 h-4"></i>
                                    <span>Timesheets</span>
                                </button>
                                ${isAdmin ? `
                                <button onclick="switchTab('employees')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition ${state.activeTab === 'employees' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}">
                                    <i data-lucide="users" class="w-4 h-4"></i>
                                    <span>Team & Rates</span>
                                </button>
                                ` : ''}
                                <button onclick="switchTab('settings')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition ${state.activeTab === 'settings' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}">
                                    <i data-lucide="settings" class="w-4 h-4"></i>
                                    <span>Settings</span>
                                </button>
                            </nav>
                        </div>
                        <div class="p-4 border-t border-slate-800/80">
                            <div class="flex items-center justify-between mb-3 px-2">
                                <div class="truncate">
                                    <p class="text-xs font-semibold text-slate-200 truncate">${state.currentUser.name || state.currentUser.email}</p>
                                    <p class="text-[10px] text-slate-400 truncate">${state.currentUser.email}</p>
                                </div>
                            </div>
                            <button onclick="handleLogout()" class="w-full flex items-center justify-center gap-2 bg-slate-800/80 hover:bg-red-950/50 hover:text-red-400 hover:border-red-900/50 border border-slate-700/60 text-slate-300 py-2.5 rounded-xl text-xs font-medium transition">
                                <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                                <span>Sign Out</span>
                            </button>
                        </div>
                    </aside>

                    <!-- Main Content Area -->
                    <main class="flex-1 flex flex-col overflow-y-auto">
                        <header class="h-16 border-b border-slate-800/80 bg-slate-900/40 backdrop-blur px-8 flex items-center justify-between sticky top-0 z-10">
                            <h1 class="text-lg font-bold text-slate-100 capitalize">${state.activeTab}</h1>
                            <div class="flex items-center gap-3">
                                <span class="px-3 py-1 bg-indigo-950/80 border border-indigo-800/60 text-indigo-300 rounded-full text-xs font-medium">
                                    ${isAdmin ? '👑 Administrator' : '👤 Employee'}
                                </span>
                            </div>
                        </header>
                        <div class="p-8 flex-1">
                            ${renderTabContent()}
                        </div>
                    </main>
                </div>
            `;
        }

        function switchTab(tab) {
            state.activeTab = tab;
            render();
        }

        function handleLogout() {
            state.currentUser = null;
            showToast('Signed out successfully.');
            render();
        }

        // --- TAB CONTENT ROUTER ---
        function renderTabContent() {
            switch (state.activeTab) {
                case 'dashboard': return renderDashboardHome();
                case 'projects': return renderProjectsTab();
                case 'timesheets': return renderTimesheetsTab();
                case 'employees': return state.currentUser.role === 'admin' ? renderEmployeesTab() : '';
                case 'settings': return renderSettingsTab();
                default: return '';
            }
        }

        // --- DASHBOARD HOME ---
        function renderDashboardHome() {
            const isAdmin = state.currentUser.role === 'admin';
            const totalProjects = state.projects.length;
            const pendingTimesheets = state.timesheets.filter(t => t.status === 'Pending').length;
            const totalEmployees = state.users.filter(u => u.role === 'employee').length;

            return `
                <div class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                            <div class="flex items-center justify-between mb-4">
                                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Total Projects</span>
                                <div class="p-2.5 rounded-xl bg-indigo-950 text-indigo-400 border border-indigo-900/50"><i data-lucide="folder-kanban" class="w-5 h-5"></i></div>
                            </div>
                            <h3 class="text-3xl font-bold text-slate-100">${totalProjects}</h3>
                            <p class="text-xs text-slate-500 mt-1">Active client deliverables</p>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                            <div class="flex items-center justify-between mb-4">
                                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Pending Timesheets</span>
                                <div class="p-2.5 rounded-xl bg-amber-950 text-amber-400 border border-amber-900/50"><i data-lucide="clock" class="w-5 h-5"></i></div>
                            </div>
                            <h3 class="text-3xl font-bold text-slate-100">${pendingTimesheets}</h3>
                            <p class="text-xs text-slate-500 mt-1">Awaiting review & approval</p>
                        </div>
                        ${isAdmin ? `
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                            <div class="flex items-center justify-between mb-4">
                                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Registered Employees</span>
                                <div class="p-2.5 rounded-xl bg-emerald-950 text-emerald-400 border border-emerald-900/50"><i data-lucide="users" class="w-5 h-5"></i></div>
                            </div>
                            <h3 class="text-3xl font-bold text-slate-100">${totalEmployees}</h3>
                            <p class="text-xs text-slate-500 mt-1">Active team members</p>
                        </div>
                        ` : `
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                            <div class="flex items-center justify-between mb-4">
                                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Your Timesheets</span>
                                <div class="p-2.5 rounded-xl bg-indigo-950 text-indigo-400 border border-indigo-900/50"><i data-lucide="file-text" class="w-5 h-5"></i></div>
                            </div>
                            <h3 class="text-3xl font-bold text-slate-100">${state.timesheets.filter(t => t.employeeEmail === state.currentUser.email).length}</h3>
                            <p class="text-xs text-slate-500 mt-1">Total submitted timecards</p>
                        </div>
                        `}
                    </div>

                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                        <h3 class="text-base font-bold text-slate-100 mb-4">Recent Projects Overview</h3>
                        ${state.projects.length === 0 ? `
                            <p class="text-sm text-slate-500">No projects created yet.</p>
                        ` : `
                            <div class="space-y-3">
                                ${state.projects.slice(0, 5).map(p => `
                                    <div class="flex items-center justify-between p-4 bg-slate-950 border border-slate-800/80 rounded-xl">
                                        <div>
                                            <h4 class="font-semibold text-slate-200 text-sm">${p.name}</h4>
                                            <p class="text-xs text-slate-400 mt-0.5">Client: ${p.client} • ${p.tasks.length} Tasks</p>
                                        </div>
                                        <div class="text-right">
                                            <span class="text-sm font-bold text-indigo-400">${p.totalHours} hrs</span>
                                            <p class="text-[10px] text-slate-500">Budgeted</p>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        // --- PROJECTS & TASKS TAB ---
        let currentEditingProjectId = null;
        function renderProjectsTab() {
            const isAdmin = state.currentUser.role === 'admin';
            return `
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-xl font-bold text-slate-100">Projects & Detailed Tasks</h2>
                            <p class="text-xs text-slate-400 mt-1">Manage deliverables, milestones, and granular task hours.</p>
                        </div>
                        ${isAdmin ? `
                        <button onclick="openProjectModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2.5 rounded-xl transition flex items-center gap-2 text-sm shadow-lg shadow-indigo-600/30">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                            <span>New Project</span>
                        </button>
                        ` : ''}
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        ${state.projects.length === 0 ? `
                            <div class="col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-12 text-center text-slate-500">
                                <i data-lucide="folder-kanban" class="w-12 h-12 mx-auto mb-3 opacity-40"></i>
                                <p class="text-sm">No projects recorded in the CRM yet.</p>
                            </div>
                        ` : state.projects.map(p => `
                            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col justify-between shadow-xl">
                                <div>
                                    <div class="flex items-start justify-between mb-3">
                                        <div>
                                            <span class="text-[10px] uppercase tracking-wider font-semibold px-2.5 py-1 bg-indigo-950 text-indigo-300 border border-indigo-900/50 rounded-full">${p.client}</span>
                                            <h3 class="text-lg font-bold text-slate-100 mt-2">${p.name}</h3>
                                        </div>
                                        ${isAdmin ? `
                                        <div class="flex items-center gap-1">
                                            <button onclick="editProject('${p.id}')" class="p-2 hover:bg-slate-800 text-slate-400 hover:text-indigo-400 rounded-lg transition"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                                            <button onclick="deleteProject('${p.id}')" class="p-2 hover:bg-slate-800 text-slate-400 hover:text-red-400 rounded-lg transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                        </div>
                                        ` : ''}
                                    </div>
                                    <p class="text-xs text-slate-400 mb-4">${p.description || 'No description provided.'}</p>
                                    
                                    <div class="space-y-2 mb-4">
                                        <div class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Tasks & Detailed Hours:</div>
                                        <div class="space-y-1.5 max-h-40 overflow-y-auto pr-1">
                                            ${p.tasks.map(t => `
                                                <div class="flex items-center justify-between bg-slate-950 px-3 py-2 rounded-xl border border-slate-800/60 text-xs">
                                                    <span class="text-slate-300">${t.title}</span>
                                                    <span class="font-bold text-indigo-400">${t.hours} hrs</span>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                </div>
                                <div class="pt-4 border-t border-slate-800 flex items-center justify-between text-xs">
                                    <span class="text-slate-400">Total Budget:</span>
                                    <span class="font-bold text-slate-100 text-sm">${p.totalHours} Hours</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <!-- Project Modal -->
                <div id="project-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
                    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-lg shadow-2xl max-h-[90vh] flex flex-col">
                        <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800">
                            <h3 id="project-modal-title" class="text-lg font-bold text-slate-100">Create New Project</h3>
                            <button onclick="closeProjectModal()" class="text-slate-400 hover:text-slate-200"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <form onsubmit="handleSaveProject(event)" class="space-y-4 overflow-y-auto flex-1 pr-1">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Project Name</label>
                                <input type="text" id="proj-name" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Client Name</label>
                                <input type="text" id="proj-client" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Total Project Hours Budget</label>
                                <input type="number" id="proj-total-hours" required min="1" step="0.5" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Description</label>
                                <textarea id="proj-desc" rows="2" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500"></textarea>
                            </div>
                            <div>
                                <div class="flex items-center justify-between mb-2">
                                    <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">Project Tasks & Hours</label>
                                    <button type="button" onclick="addTaskRow()" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium flex items-center gap-1"><i data-lucide="plus" class="w-3.5 h-3.5"></i> Add Task</button>
                                </div>
                                <div id="task-rows-container" class="space-y-2">
                                    <!-- Dynamic task inputs -->
                                </div>
                            </div>
                            <div class="pt-4 border-t border-slate-800 flex justify-end gap-3">
                                <button type="button" onclick="closeProjectModal()" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium">Cancel</button>
                                <button type="submit" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium shadow-lg shadow-indigo-600/30">Save Project</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function openProjectModal(projectId = null) {
            currentEditingProjectId = projectId;
            const modal = document.getElementById('project-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            const container = document.getElementById('task-rows-container');
            container.innerHTML = '';

            if (projectId) {
                document.getElementById('project-modal-title').innerText = 'Edit Project';
                const p = state.projects.find(x => x.id === projectId);
                document.getElementById('proj-name').value = p.name;
                document.getElementById('proj-client').value = p.client;
                document.getElementById('proj-total-hours').value = p.totalHours;
                document.getElementById('proj-desc').value = p.description || '';
                p.tasks.forEach(t => addTaskRow(t.title, t.hours));
            } else {
                document.getElementById('project-modal-title').innerText = 'Create New Project';
                document.getElementById('proj-name').value = '';
                document.getElementById('proj-client').value = '';
                document.getElementById('proj-total-hours').value = '';
                document.getElementById('proj-desc').value = '';
                addTaskRow();
            }
            lucide.createIcons();
        }

        function closeProjectModal() {
            const modal = document.getElementById('project-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
            currentEditingProjectId = null;
        }

        function addTaskRow(title = '', hours = '') {
            const container = document.getElementById('task-rows-container');
            const div = document.createElement('div');
            div.className = 'flex items-center gap-2 task-row-item';
            div.innerHTML = `
                <input type="text" placeholder="Task name" value="${title}" class="task-title-input flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500" required>
                <input type="number" placeholder="Hours" value="${hours}" min="0.5" step="0.5" class="task-hours-input w-24 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500" required>
                <button type="button" onclick="this.parentElement.remove()" class="p-2 hover:bg-slate-800 text-slate-400 hover:text-red-400 rounded-lg"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
            `;
            container.appendChild(div);
            lucide.createIcons();
        }

        function handleSaveProject(e) {
            e.preventDefault();
            const name = document.getElementById('proj-name').value.trim();
            const client = document.getElementById('proj-client').value.trim();
            const totalHours = parseFloat(document.getElementById('proj-total-hours').value);
            const description = document.getElementById('proj-desc').value.trim();

            const taskRows = document.querySelectorAll('.task-row-item');
            let tasks = [];
            let sumTaskHours = 0;

            taskRows.forEach(row => {
                const title = row.querySelector('.task-title-input').value.trim();
                const hours = parseFloat(row.querySelector('.task-hours-input').value) || 0;
                if (title) {
                    tasks.push({ title, hours });
                    sumTaskHours += hours;
                }
            });

            if (sumTaskHours > totalHours) {
                showToast(`Error: Total project time (${totalHours} hrs) cannot be exceeded by the total tasks time (${sumTaskHours} hrs).`, 'error');
                return;
            }

            if (currentEditingProjectId) {
                const p = state.projects.find(x => x.id === currentEditingProjectId);
                p.name = name;
                p.client = client;
                p.totalHours = totalHours;
                p.description = description;
                p.tasks = tasks;
                showToast('Project updated successfully.');
            } else {
                const newProj = {
                    id: 'proj_' + Date.now(),
                    name, client, totalHours, description, tasks
                };
                state.projects.push(newProj);
                showToast('Project created successfully.');
            }

            saveState();
            closeProjectModal();
            render();
        }

        function editProject(id) {
            openProjectModal(id);
        }

        function deleteProject(id) {
            if (confirm('Are you sure you want to delete this project?')) {
                state.projects = state.projects.filter(p => p.id !== id);
                saveState();
                showToast('Project deleted.');
                render();
            }
        }

        // --- TIMESHEETS TAB ---
        function renderTimesheetsTab() {
            const isAdmin = state.currentUser.role === 'admin';
            const userTimesheets = isAdmin ? state.timesheets : state.timesheets.filter(t => t.employeeEmail === state.currentUser.email);

            return `
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-xl font-bold text-slate-100">Weekly Timesheets</h2>
                            <p class="text-xs text-slate-400 mt-1">Submit and review weekly hours allocated per project task.</p>
                        </div>
                        ${!isAdmin ? `
                        <button onclick="openTimesheetModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2.5 rounded-xl transition flex items-center gap-2 text-sm shadow-lg shadow-indigo-600/30">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                            <span>Submit Timesheet</span>
                        </button>
                        ` : ''}
                    </div>

                    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="border-b border-slate-800 bg-slate-950/50 text-xs font-semibold text-slate-400 uppercase tracking-wider">
                                        <th class="p-4">Employee</th>
                                        <th class="p-4">Week Ending</th>
                                        <th class="p-4">Project & Task</th>
                                        <th class="p-4">Hours</th>
                                        <th class="p-4">Status</th>
                                        <th class="p-4 text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-800/80 text-sm">
                                    ${userTimesheets.length === 0 ? `
                                        <tr><td colspan="6" class="p-8 text-center text-slate-500">No timesheet submissions found.</td></tr>
                                    ` : userTimesheets.map(t => `
                                        <tr class="hover:bg-slate-800/30 transition">
                                            <td class="p-4 font-medium text-slate-200">${t.employeeName}</td>
                                            <td class="p-4 text-slate-300">${t.weekEnding}</td>
                                            <td class="p-4">
                                                <div class="font-medium text-slate-200">${t.projectName}</div>
                                                <div class="text-xs text-slate-400">${t.taskName}</div>
                                            </td>
                                            <td class="p-4 font-bold text-indigo-400">${t.hours} hrs</td>
                                            <td class="p-4">
                                                <span class="px-2.5 py-1 rounded-full text-xs font-medium ${
                                                    t.status === 'Approved' ? 'bg-emerald-950 text-emerald-300 border border-emerald-900/50' :
                                                    t.status === 'Rejected' ? 'bg-red-950 text-red-300 border border-red-900/50' :
                                                    'bg-amber-950 text-amber-300 border border-amber-900/50'
                                                }">${t.status}</span>
                                            </td>
                                            <td class="p-4 text-right">
                                                ${isAdmin && t.status === 'Pending' ? `
                                                    <button onclick="updateTimesheetStatus('${t.id}', 'Approved')" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-medium mr-1.5 transition">Approve</button>
                                                    <button onclick="updateTimesheetStatus('${t.id}', 'Rejected')" class="px-3 py-1 bg-red-600 hover:bg-red-500 text-white rounded-lg text-xs font-medium transition">Reject</button>
                                                ` : `
                                                    <span class="text-xs text-slate-500">-</span>
                                                `}
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Timesheet Modal -->
                <div id="timesheet-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
                    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-md shadow-2xl">
                        <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800">
                            <h3 class="text-lg font-bold text-slate-100">Submit Weekly Timesheet</h3>
                            <button onclick="closeTimesheetModal()" class="text-slate-400 hover:text-slate-200"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <form onsubmit="handleSaveTimesheet(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Week Ending Date</label>
                                <input type="date" id="ts-date" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Select Project</label>
                                <select id="ts-project" onchange="populateTaskDropdown()" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                                    <option value="">-- Choose Project --</option>
                                    ${state.projects.map(p => `<option value="${p.id}">${p.name} (${p.client})</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Select Task</label>
                                <select id="ts-task" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                                    <option value="">-- Choose Task --</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Hours Worked</label>
                                <input type="number" id="ts-hours" required min="0.5" step="0.5" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500" placeholder="e.g. 8">
